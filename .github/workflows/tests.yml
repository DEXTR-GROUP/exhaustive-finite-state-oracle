name: EFSO tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Generate E4-001 evidence
        run: python validation/e4_001_evidence.py
      - name: Upload E4-001 evidence
        uses: actions/upload-artifact@v4
        with:
          name: efso-e4-001-evidence
          path: evidence/e4_001.json
          if-no-files-found: error

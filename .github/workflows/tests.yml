name: EFSO tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Generate E4-001 evidence
        run: python validation/e4_001_evidence.py
      - name: Generate FM2-R4-002 evidence
        run: python validation/fm2_r4_002_evidence.py
      - name: Run exhaustive R4 numerical conformance
        run: python validation/r4_numerical_conformance.py
      - name: Generate E5-001 evidence
        run: python validation/e5_001_evidence.py
      - name: Run E6-001 exhaustive conformance
        run: python validation/e6_001_evidence.py
      - name: Run E7-001 exhaustive invariant qualification
        run: python validation/e7_001_evidence.py
      - name: Upload EFSO qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: efso-qualification-evidence
          path: evidence/*.json
          if-no-files-found: error
